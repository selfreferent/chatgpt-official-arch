# SPDX-License-Identifier: 0BSD
name: Update upstream release
on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chatgpt-upstream-update
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.update.outputs.changed }}
      base: ${{ steps.base.outputs.revision }}
    steps:
      - name: Prepare Arch builder
        run: |
          pacman -Syu --noconfirm --needed python namcap git curl zstd sudo
          useradd --create-home builder
          echo "builder ALL=(root) NOPASSWD: /usr/bin/pacman" > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder
      # Install Git before checkout to require a real repository, not an archive.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Assign workspace and verify checkout
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- git rev-parse --is-inside-work-tree
      - name: Record validated base
        id: base
        run: |
          printf 'revision=%s\n' "$(runuser -u builder -- git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Discover and update
        id: update
        run: |
          runuser -u builder -- scripts/validate.sh
          runuser -u builder -- scripts/update-upstream.sh --json > report.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          print('changed='+str(json.load(open('report.json'))['updated']).lower())
          PY
      - name: Full validation of changed release
        if: steps.update.outputs.changed == 'true'
        run: |
          pacman -S --noconfirm --needed vulkan-swrast
          runuser -u builder -- makepkg --syncdeps --noconfirm --verifysource --force
          runuser -u builder -- scripts/validate.sh --full
      - name: Prepare metadata-only handoff
        if: steps.update.outputs.changed == 'true'
        run: |
          mkdir validated-update
          runuser -u builder -- git diff --binary -- PKGBUILD .SRCINFO > validated-update/update.patch
          printf '%s\n' '${{ steps.base.outputs.revision }}' > validated-update/base.txt
          cp report.json validated-update/report.json
          cat report.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.update.outputs.changed == 'true'
        with:
          name: validated-update
          path: validated-update/
          retention-days: 1
          if-no-files-found: error
      - name: Failure summary
        if: failure()
        run: echo 'Update failed validation. Review the failing step; the automation branch was not modified.' >> "$GITHUB_STEP_SUMMARY"
  publish:
    needs: validate
    if: needs.validate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Prepare publisher
        run: |
          pacman -Syu --noconfirm --needed python git
          useradd --create-home builder
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate.outputs.base }}
      - name: Assign workspace and verify checkout
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- git rev-parse --is-inside-work-tree
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: validated-update
          path: validated-update
      - name: Publish validated metadata PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: runuser -u builder -- python scripts/publish-update.py
