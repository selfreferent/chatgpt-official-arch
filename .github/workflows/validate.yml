# SPDX-License-Identifier: 0BSD
name: Validate packaging
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Prepare unprivileged builder
        run: |
          pacman -Syu --noconfirm --needed python namcap git curl zstd sudo
          useradd --create-home builder
          echo "builder ALL=(root) NOPASSWD: /usr/bin/pacman" > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder
      # Git must exist before checkout or the action falls back to a source
      # archive, which has no history for scope detection or publication.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Assign workspace and verify checkout
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- git rev-parse --is-inside-work-tree
      - name: Fast validation
        run: runuser -u builder -- scripts/validate.sh
      - name: Determine full validation scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: runuser -u builder -- python scripts/validation-scope.py >> "$GITHUB_OUTPUT"
      - name: Full package validation
        if: steps.scope.outputs.full == 'true'
        run: |
          pacman -S --noconfirm --needed vulkan-swrast
          runuser -u builder -- makepkg --syncdeps --noconfirm --verifysource --force
          runuser -u builder -- scripts/validate.sh --full
