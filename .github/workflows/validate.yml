# SPDX-License-Identifier: 0BSD
name: Validate packaging
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Prepare unprivileged builder
        run: |
          pacman -Syu --noconfirm --needed python namcap git curl zstd sudo
          useradd --create-home builder
          echo "builder ALL=(root) NOPASSWD: /usr/bin/pacman" > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder
      # Git must exist before checkout or the action falls back to a source
      # archive, which has no history for scope detection or publication.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Assign workspace and verify checkout
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- git rev-parse --is-inside-work-tree
      - name: Verify read-only builder credential boundary
        run: runuser -u builder -- python scripts/check-credentials.py absent
      - name: Fast validation
        run: runuser -u builder -- scripts/validate.sh
      - name: Determine full validation scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: runuser -u builder -- python scripts/validation-scope.py >> "$GITHUB_OUTPUT"
      - name: Full package validation
        if: steps.scope.outputs.full == 'true'
        run: |
          pacman -S --noconfirm --needed vulkan-swrast
          runuser -u builder -- makepkg --syncdeps --noconfirm --verifysource --force
          runuser -u builder -- scripts/validate.sh --full
  handoff-upload:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Prepare credential smoke test
        run: |
          pacman -Syu --noconfirm --needed python git
          useradd --create-home builder
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify persisted credentials under builder
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- python scripts/check-credentials.py present
      - name: Make tiny metadata fixture
        run: |
          mkdir smoke
          printf '%s\n' '{"fixture":"metadata-only","version":1}' > smoke/report.json
          printf '%s\n' 'Tiny metadata handoff' > smoke/update.patch
          sha256sum smoke/* > smoke.sha256
          mv smoke.sha256 smoke/checksums.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: handoff-smoke
          path: smoke/
          retention-days: 1
          if-no-files-found: error
  handoff-download:
    needs: handoff-upload
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Prepare fixture consumer
        run: |
          pacman -Syu --noconfirm --needed python git
          useradd --create-home builder
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: handoff-smoke
          path: smoke
      - name: Verify metadata fixture survived ZIP handoff
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- python scripts/check-credentials.py absent
          runuser -u builder -- sha256sum --check smoke/checksums.txt
          test "$(find smoke -type f | wc -l)" -eq 3
